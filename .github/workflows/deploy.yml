name: Deploy Zola site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check and build site
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ghcr.io/getzola/zola:v0.23.6 check
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ghcr.io/getzola/zola:v0.23.6 build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
